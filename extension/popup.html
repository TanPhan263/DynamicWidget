<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lintel</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/32.png" alt="" width="20" height="20" />
      <h1>Lintel</h1>
      <span id="status" class="badge" role="status">Checking…</span>
    </header>

    <section id="pair">
      <p class="hint">Can’t reach Lintel. Make sure Lintel is running, then reload this extension.</p>
    </section>

    <section class="rows">
      <label class="row">
        <span>Forward notifications</span>
        <input id="enabled" type="checkbox" role="switch" />
      </label>
      <label class="row" id="site-row" hidden>
        <span>From <strong id="site"></strong></span>
        <input id="site-enabled" type="checkbox" role="switch" />
      </label>
    </section>

    <footer>
      <button id="test" type="button">Send test</button>
      <p class="hint">A site notifies only after you allow notifications for it in the browser.</p>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
